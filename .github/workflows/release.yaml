name: Tag New Version and Release

on:
  push:
    branches:
      - m
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  tag-and-release:
    uses: George-Ogden/actions/.github/workflows/python-release.yaml@v5.1.2
    with:
      validation-code: "import linter"
      validation-script: "lint `which lint`"
      python-version: "3.15"
